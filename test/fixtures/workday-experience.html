<!doctype html><html><head><meta charset="utf-8"><title>My Experience — Workday</title>
<style>body{font-family:system-ui;padding:20px;max-width:820px}
.f{margin-bottom:12px}label{display:block;font-weight:600;font-size:13px;margin-bottom:3px}
input,select,textarea{width:320px;padding:7px;border:1px solid #ccd;border-radius:5px}
h3{margin:20px 0 6px}h4{margin:14px 0 6px}</style></head><body>
<div data-automation-id="applyFlowPage">
  <h2>My Experience</h2>

  <h3>Work Experience</h3>
  <div data-automation-id="workExperience-1">
    <h4>Work Experience 1</h4>
    <div class="f"><label for="w1t">Job Title *</label><input id="w1t" type="text"></div>
    <div class="f"><label for="w1c">Company *</label><input id="w1c" type="text"></div>
    <div class="f"><label for="w1l">Location</label><input id="w1l" type="text"></div>
    <div class="f"><label><input id="w1cur" type="checkbox"> I currently work here</label></div>
    <div class="f"><label for="w1f">From *</label><input id="w1f" type="text" placeholder="MM/YYYY"></div>
    <div class="f"><label for="w1to">To *</label><input id="w1to" type="text" placeholder="MM/YYYY"></div>
    <div class="f"><label for="w1d">Role Description</label><textarea id="w1d" rows="2"></textarea></div>
  </div>

  <h3>Education</h3>
  <div data-automation-id="education-1">
    <h4>Education 1</h4>
    <div class="f"><label for="e1s">School or University *</label><input id="e1s" type="text"></div>
    <div class="f"><label for="e1d">Degree *</label>
      <select id="e1d"><option value="">Select One</option><option>Bachelors</option><option>Masters</option><option>Doctorate</option></select></div>
    <div class="f"><label for="e1fld">Field of Study</label><input id="e1fld" type="text"></div>
    <div class="f"><label for="e1from">From</label><input id="e1from" type="text" placeholder="YYYY"></div>
    <div class="f"><label for="e1to">To (Actual or Expected)</label><input id="e1to" type="text" placeholder="YYYY"></div>
  </div>

  <h3>Websites</h3>
  <div class="f"><label for="site1">Add any relevant websites.</label><input id="site1" type="text"></div>

  <h3>Social Network URLs</h3>
  <div class="f"><label for="li">Please provide your LinkedIn profile:</label><input id="li" type="text"></div>

  <input type="file" id="resume"><button type="submit" id="save">Save and Continue</button>
  <div id="errors"></div>
</div>
<script>
/* Workday keeps its own model and only accepts a value it saw change. It tracks
   the last value it knows about on the node, exactly as React does, and ignores
   any change event that agrees with that record. */
const model = Object.create(null);
document.querySelectorAll("input[type=text], textarea, select").forEach((el) => {
  el._valueTracker = {
    _v: el.value,
    getValue() { return this._v; },
    setValue(v) { this._v = String(v); },
  };
  el.addEventListener("input", () => {
    const seen = el._valueTracker.getValue();
    if (seen === el.value) return;          // nothing changed as far as it knows
    el._valueTracker.setValue(el.value);
    model[el.id] = el.value;
  }, true);
});
document.getElementById("save").addEventListener("click", () => {
  const missing = ["w1t", "w1c", "e1s"].filter((id) => !model[id]);
  window.__modelErrors = missing;
  document.getElementById("errors").textContent =
    missing.map((id) => "The field " + id + " is required and must have a value.").join(" ");
});
window.__model = model;
</script></body></html>
