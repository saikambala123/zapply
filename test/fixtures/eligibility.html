<!doctype html><html><head><meta charset="utf-8"><title>Application — Eligibility</title>
<style>body{font-family:system-ui;padding:20px;max-width:760px}
.f{margin-bottom:14px}label{display:block;font-weight:600;margin-bottom:4px}
select{width:100%;padding:7px;border:1px solid #ccd;border-radius:5px}</style></head><body>
<form id="application_form">
  <h2>Work Eligibility</h2>
  <div class="f"><label for="q1">Are you legally authorized to work in the United States?</label>
    <select id="q1"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
  <div class="f"><label for="q2">Will you now or in the future require sponsorship for employment visa status?</label>
    <select id="q2"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
  <div class="f"><label for="q3">Are you able to work in the United States without sponsorship, now or in the future?</label>
    <select id="q3"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
  <div class="f"><label for="q4">Do you require sponsorship to work in the United States?</label>
    <select id="q4"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
  <div class="f"><label for="q5">Are you at least 18 years of age?</label>
    <select id="q5"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
  <div class="f"><label for="q6">Have you previously been employed by this company?</label>
    <select id="q6"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>

  <h2>U.S. Equal Employment Opportunity Information</h2>
  <div class="f"><label for="e1">Gender</label>
    <select id="e1"><option value="">Select…</option><option>Male</option><option>Female</option><option>Decline to self identify</option></select></div>
  <div class="f"><label for="e2">Are you Hispanic or Latino?</label>
    <select id="e2"><option value="">Select…</option><option>Yes</option><option>No</option><option>Decline to self identify</option></select></div>
  <div class="f"><label for="e3">Race</label>
    <select id="e3"><option value="">Select…</option><option>Asian</option><option>White</option><option>Black or African American</option><option>Decline to self identify</option></select></div>
  <div class="f"><label for="e4">Veteran Status</label>
    <select id="e4"><option value="">Select…</option><option>I am not a protected veteran</option><option>I identify as one or more of the classifications of a protected veteran</option><option>I don't wish to answer</option></select></div>
  <div class="f"><label for="e5">Disability Status</label>
    <select id="e5"><option value="">Select…</option><option>Yes, I have a disability</option><option>No, I don't have a disability</option><option>I don't wish to answer</option></select></div>
  <input type="file" id="resume"><button type="submit">Submit</button>
</form></body></html>
