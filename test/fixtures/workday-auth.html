<!doctype html><html><head><meta charset="utf-8"><title>Sign In — Workday</title>
<style>body{font-family:system-ui;padding:24px;max-width:420px}
.f{margin-bottom:14px}label{display:block;font-weight:600;margin-bottom:4px}
input{width:100%;padding:8px;border:1px solid #ccd;border-radius:5px}</style></head><body>
<div data-automation-id="authPage">
  <h1>Create Account</h1>
  <p>Create an account to apply for this job.</p>
  <div class="f"><label for="a-email">Email Address</label><input id="a-email" data-automation-id="email" type="text"></div>
  <div class="f"><label for="a-pass">Password</label><input id="a-pass" data-automation-id="password" type="password"></div>
  <div class="f"><label for="a-pass2">Verify New Password</label><input id="a-pass2" data-automation-id="verifyPassword" type="password"></div>
  <button type="button" data-automation-id="createAccountSubmitButton">Create Account</button>
</div></body></html>
