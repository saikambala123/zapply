<!doctype html><html><head><meta charset="utf-8"><title>My Experience — Workday</title>
<style>
body{font-family:system-ui;padding:20px;max-width:860px}
.f{margin-bottom:12px}label{display:block;font-weight:600;font-size:13px;margin-bottom:3px}
input[type=text],textarea,select{padding:7px;border:1px solid #ccd;border-radius:5px}
.wd-date{display:inline-flex;align-items:center;border:1px solid #ccd;border-radius:5px;padding:2px 6px}
.wd-date input{border:0;text-align:center;font:inherit;padding:4px 2px}
.wd-date input[data-automation-id$="Month-input"]{width:2.2em}
.wd-date input[data-automation-id$="Year-input"]{width:3.4em}
.sep{color:#666;padding:0 2px}
.err{color:#b00;font-size:12px;margin-top:2px}
h3{margin:22px 0 6px}h4{margin:14px 0 6px}
</style></head><body>
<div data-automation-id="applyFlowPage">
  <h2>My Experience</h2>
  <h3>Work Experience</h3>

  <div data-automation-id="workExperience-1">
    <h4>Work Experience 1</h4>
    <div class="f"><label for="w1t">Job Title *</label><input id="w1t" type="text"></div>
    <div class="f"><label for="w1c">Company *</label><input id="w1c" type="text"></div>
    <div class="f"><label for="w1l">Location</label><input id="w1l" type="text"></div>
    <div class="f"><label><input id="w1cur" type="checkbox"> I currently work here</label></div>

    <div class="f" data-automation-id="formField-startDate">
      <label id="w1-from-l">From *</label>
      <div class="wd-date" role="group" data-automation-id="dateInputWrapper" aria-labelledby="w1-from-l">
        <div data-automation-id="dateSectionMonth-display">
          <input id="w1f-m" type="text" role="spinbutton" data-automation-id="dateSectionMonth-input"
                 aria-label="Month" aria-valuemin="1" aria-valuemax="12" aria-valuetext="MM" autocomplete="off">
        </div><span class="sep">/</span>
        <div data-automation-id="dateSectionYear-display">
          <input id="w1f-y" type="text" role="spinbutton" data-automation-id="dateSectionYear-input"
                 aria-label="Year" aria-valuemin="1900" aria-valuemax="2100" aria-valuetext="YYYY" autocomplete="off">
        </div>
        <button type="button" data-automation-id="dateIcon" aria-label="Calendar">&#128197;</button>
      </div>
      <div class="err" id="w1f-err"></div>
    </div>

    <div class="f" data-automation-id="formField-endDate">
      <label id="w1-to-l">To *</label>
      <div class="wd-date" role="group" data-automation-id="dateInputWrapper" aria-labelledby="w1-to-l">
        <div data-automation-id="dateSectionMonth-display">
          <input id="w1to-m" type="text" role="spinbutton" data-automation-id="dateSectionMonth-input"
                 aria-label="Month" aria-valuemin="1" aria-valuemax="12" aria-valuetext="MM" autocomplete="off">
        </div><span class="sep">/</span>
        <div data-automation-id="dateSectionYear-display">
          <input id="w1to-y" type="text" role="spinbutton" data-automation-id="dateSectionYear-input"
                 aria-label="Year" aria-valuemin="1900" aria-valuemax="2100" aria-valuetext="YYYY" autocomplete="off">
        </div>
        <button type="button" data-automation-id="dateIcon" aria-label="Calendar">&#128197;</button>
      </div>
      <div class="err" id="w1to-err"></div>
    </div>

    <div class="f"><label for="w1d">Role Description</label><textarea id="w1d" rows="2"></textarea></div>
  </div>

  <div data-automation-id="workExperience-2">
    <h4>Work Experience 2</h4>
    <div class="f"><label for="w2t">Job Title *</label><input id="w2t" type="text"></div>
    <div class="f"><label for="w2c">Company *</label><input id="w2c" type="text"></div>
    <div class="f"><label for="w2l">Location</label><input id="w2l" type="text"></div>
    <div class="f"><label><input id="w2cur" type="checkbox"> I currently work here</label></div>

    <div class="f" data-automation-id="formField-startDate">
      <label id="w2-from-l">From *</label>
      <div class="wd-date" role="group" data-automation-id="dateInputWrapper" aria-labelledby="w2-from-l">
        <div data-automation-id="dateSectionMonth-display">
          <input id="w2f-m" type="text" role="spinbutton" data-automation-id="dateSectionMonth-input"
                 aria-label="Month" aria-valuemin="1" aria-valuemax="12" aria-valuetext="MM" autocomplete="off">
        </div><span class="sep">/</span>
        <div data-automation-id="dateSectionYear-display">
          <input id="w2f-y" type="text" role="spinbutton" data-automation-id="dateSectionYear-input"
                 aria-label="Year" aria-valuemin="1900" aria-valuemax="2100" aria-valuetext="YYYY" autocomplete="off">
        </div>
        <button type="button" data-automation-id="dateIcon" aria-label="Calendar">&#128197;</button>
      </div>
      <div class="err" id="w2f-err"></div>
    </div>

    <div class="f" data-automation-id="formField-endDate">
      <label id="w2-to-l">To *</label>
      <div class="wd-date" role="group" data-automation-id="dateInputWrapper" aria-labelledby="w2-to-l">
        <div data-automation-id="dateSectionMonth-display">
          <input id="w2to-m" type="text" role="spinbutton" data-automation-id="dateSectionMonth-input"
                 aria-label="Month" aria-valuemin="1" aria-valuemax="12" aria-valuetext="MM" autocomplete="off">
        </div><span class="sep">/</span>
        <div data-automation-id="dateSectionYear-display">
          <input id="w2to-y" type="text" role="spinbutton" data-automation-id="dateSectionYear-input"
                 aria-label="Year" aria-valuemin="1900" aria-valuemax="2100" aria-valuetext="YYYY" autocomplete="off">
        </div>
        <button type="button" data-automation-id="dateIcon" aria-label="Calendar">&#128197;</button>
      </div>
      <div class="err" id="w2to-err"></div>
    </div>

    <div class="f"><label for="w2d">Role Description</label><textarea id="w2d" rows="2"></textarea></div>
  </div>

  <button type="submit" id="save">Save and Continue</button>
</div>
<script>
/* Workday's date segments: each box holds at most its own part, refuses
   non-digits, and the widget validates month+year together on blur — which is
   what produces "Error: Invalid Date: /2021" when only the year lands. */
const PAIRS = [
  ["w1f-m", "w1f-y", "w1f-err"], ["w1to-m", "w1to-y", "w1to-err"],
  ["w2f-m", "w2f-y", "w2f-err"], ["w2to-m", "w2to-y", "w2to-err"],
];
const model = Object.create(null);
document.querySelectorAll('.wd-date input').forEach((el) => {
  const isYear = el.dataset.automationId.includes("Year");
  el._valueTracker = { _v: el.value, getValue() { return this._v; }, setValue(v) { this._v = String(v); } };
  el.addEventListener("beforeinput", (e) => {
    if (e.data && /\D/.test(e.data)) e.preventDefault();     // digits only
  });
  el.addEventListener("input", () => {
    const cap = isYear ? 4 : 2;
    const digits = el.value.replace(/\D/g, "").slice(0, cap);
    if (digits !== el.value) el.value = digits;
    if (el._valueTracker.getValue() === el.value) return;
    el._valueTracker.setValue(el.value);
    model[el.id] = el.value;
  }, true);
});
function validate() {
  for (const [m, y, err] of PAIRS) {
    const mv = document.getElementById(m).value, yv = document.getElementById(y).value;
    const node = document.getElementById(err);
    if (!mv && !yv) { node.textContent = ""; continue; }
    node.textContent = (mv && yv) ? "" : "Error: Invalid Date: " + mv + "/" + yv;
  }
}
document.addEventListener("focusout", () => setTimeout(validate, 0), true);
document.getElementById("save").addEventListener("click", () => { validate();
  window.__dateErrors = PAIRS.map(([,,e]) => document.getElementById(e).textContent).filter(Boolean); });
window.__model = model;
window.__validate = validate;
</script></body></html>
